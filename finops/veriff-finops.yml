specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Veriff
providerId: veriff
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - KYC
  - Identity Verification
  - Biometrics
  - Fraud Prevention
  - AML
  - FinOps
  - FOCUS
description: >-
  FOCUS-aligned FinOps for Veriff. Cost is dominated by per-verification consumption
  against the active tier (Essential $0.80, Plus $1.39, Premium $1.89, Enterprise
  custom) up to the monthly minimum, plus stacked add-on per-verification surcharges
  for extended retention (+$0.30), PEP/sanctions screening (+$0.64), and ongoing
  monitoring (+$0.09). The web and mobile SDKs are free; cost begins when a session
  reaches a billable terminal state. Optimisation levers are reducing duplicate or
  abandoned sessions, choosing the lowest tier that meets the regulatory profile, and
  selectively enabling add-ons.
sources:
  - https://www.veriff.com/pricing
  - https://devdocs.veriff.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Veriff OU
serviceCategory: Identity Verification
billingModel:
  pricingCategory: Per-Verification (Tiered) + Monthly Minimum + Add-Ons
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
    - Tax
    - Credit
focusColumns:
  ServiceName: Veriff
  ServiceCategory: Identity Verification
  ProviderName: Veriff
  PublisherName: Veriff OU
  InvoiceIssuerName: Veriff OU
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: verification
    description: >-
      Per-completed verification (terminal session decision); the dominant usage
      meter, billed at the active tier's per-verification rate.
    unit: verification
    aggregation: sum
    dimensions:
      - account_id
      - plan_tier
      - country
      - document_type
  - name: monthly_minimum
    description: >-
      Monthly minimum charge for the active tier ($49 Essential / $99 Plus /
      $209 Premium / custom Enterprise); whichever is greater (minimum or actual
      usage) is billed.
    unit: month
    aggregation: max
    dimensions:
      - account_id
      - plan_tier
  - name: pep_screening
    description: >-
      Per-verification PEP / sanctions / adverse-media screening surcharge (+$0.64).
    unit: verification
    aggregation: sum
    dimensions:
      - account_id
  - name: ongoing_monitoring
    description: >-
      Per-verification ongoing-monitoring surcharge (+$0.09).
    unit: verification
    aggregation: sum
    dimensions:
      - account_id
  - name: extended_retention
    description: >-
      Per-verification extended-retention surcharge for retaining records 2 years
      instead of the tier default (+$0.30).
    unit: verification
    aggregation: sum
    dimensions:
      - account_id
principles:
  - name: Visibility
    description: >-
      Use the Veriff Customer Portal usage report to track per-tier verifications and
      add-on attach rate. Use webhook events and the Decisions API to confirm session
      lifecycle counts and reconcile against the invoice.
  - name: Allocation
    description: >-
      Pass a vendorData reference per session keyed to a business unit or product
      flow, so attribution is preserved on the invoice. Separate sandbox and
      production accounts to keep pre-prod testing off the production meter.
  - name: Optimization
    description: >-
      Avoid double-billing by collapsing duplicate sessions for the same end user.
      Choose the lowest tier consistent with the regulatory profile. Enable add-ons
      (PEP/sanctions, monitoring, extended retention) only on flows where they are
      legally or contractually required. Use the 50-session free trial to size
      production volume before committing to a tier.
  - name: Accountability
    description: >-
      Assign a compliance / fraud owner per Veriff account. Track actual usage against
      the monthly minimum and renegotiate the tier and add-ons at renewal.
maintainers:
