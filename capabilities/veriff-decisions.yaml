naftiko: 1.0.0-alpha2
info:
  label: Veriff Public API — Decisions
  description: 'Veriff Public API — Decisions. 1 operations. Lead operation: Retrieve verification decision for a session.
    Self-contained Naftiko capability covering one Veriff business surface.'
  tags:
  - Veriff
  - Decisions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VERIFF_API_KEY: VERIFF_API_KEY
capability:
  consumes:
  - type: http
    namespace: veriff-decisions
    baseUri: https://stationapi.veriff.com/v1
    description: Veriff Public API — Decisions business capability. Self-contained, no shared references.
    resources:
    - name: sessions-sessionId-decision
      path: /sessions/{sessionId}/decision
      operations:
      - name: get
        method: GET
        description: Retrieve verification decision for a session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-AUTH-CLIENT
      value: '{{env.VERIFF_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: veriff-decisions-rest
    port: 8080
    description: REST adapter for Veriff Public API — Decisions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/sessions/{sessionid}/decision
      name: sessions-sessionid-decision
      description: REST surface for sessions-sessionId-decision.
      operations:
      - method: GET
        name: get
        description: Retrieve verification decision for a session
        call: veriff-decisions.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: veriff-decisions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Veriff Public API — Decisions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: retrieve-verification-decision-session
      description: Retrieve verification decision for a session
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: veriff-decisions.get
      outputParameters:
      - type: object
        mapping: $.
