apis:
- aid: veriff:media
  name: Veriff Media API
  description: >-
    Uploads document images, selfies, and supporting media to a session and lists the media already attached.
    Used by custom flows that do not embed the Veriff SDK and capture media themselves.
  humanURL: https://devdocs.veriff.com/
  baseURL: https://stationapi.veriff.com/v1
  tags:
  - Media
  - Uploads
  - Documents
  properties:
  - type: Documentation
    url: https://devdocs.veriff.com/
- aid: veriff:decisions
  name: Veriff Decisions API
  description: >-
    Retrieves the final verification decision for a submitted session - status (approved, declined, resubmission,
    expired), reason, code, person data extracted from the document, and risk metadata. Available as a
    pull endpoint and via webhook.
  humanURL: https://devdocs.veriff.com/
  baseURL: https://stationapi.veriff.com/v1
  tags:
  - Decisions
  - Verification Results
  properties:
  - type: Documentation
    url: https://devdocs.veriff.com/
- aid: veriff:attempts
  name: Veriff Attempts API
  description: >-
    Lists individual attempts within a session - useful when a session results in resubmission. Each attempt
    carries its own captured media and reason metadata.
  humanURL: https://devdocs.veriff.com/
  baseURL: https://stationapi.veriff.com/v1
  tags:
  - Attempts
  - Resubmission
  properties:
  - type: Documentation
    url: https://devdocs.veriff.com/
- aid: veriff:persons
  name: Veriff Persons API
  description: >-
    Retrieves the person record extracted from a session decision - structured fields (first name, last
    name, date of birth, document number, nationality) and document metadata used for downstream KYC and
    CRM enrolment.
  humanURL: https://devdocs.veriff.com/
  baseURL: https://stationapi.veriff.com/v1
  tags:
  - Persons
  - Identity Data
  properties:
  - type: Documentation
    url: https://devdocs.veriff.com/
- aid: veriff:watchlist-screening
  name: Veriff Watchlist Screening API
  description: >-
    Runs and retrieves PEP, sanctions, adverse-media, and ongoing-monitoring screening tied to a verification
    session or to a stand-alone identity payload.
  humanURL: https://www.veriff.com/products/aml
  baseURL: https://stationapi.veriff.com/v1
  tags:
  - AML
  - Sanctions
  - PEP
  - Watchlist
  properties:
  - type: Documentation
    url: https://www.veriff.com/products/aml
- aid: veriff:webhooks
  name: Veriff Webhook Delivery
  description: >-
    Server-to-server delivery of decision and event notifications. Veriff signs each payload via the customer's
    shared secret using the X-HMAC-SIGNATURE header so receivers can verify authenticity. Customers configure
    the URL in the Veriff Customer Portal.
  humanURL: https://devdocs.veriff.com/
  baseURL: customer-configured
  tags:
  - Webhook
  - Event
  - HMAC
  tags_raw:
  - Webhooks
  - Events
  - HMAC
  properties:
  - type: Documentation
    url: https://devdocs.veriff.com/
- aid: veriff:web-sdk
  name: Veriff Web (InContext / Hosted) SDK
  description: >-
    Browser-based capture experience that embeds verification inside the customer's site (InContext) or
    runs as a Veriff-hosted page. Requires a session token issued by the Sessions API.
  humanURL: https://github.com/Veriff
  baseURL: https://github.com/Veriff
  tags:
  - Web SDK
  - JavaScript
  - Capture
  properties:
  - type: Documentation
    url: https://github.com/Veriff
- aid: veriff:ios-sdk
  name: Veriff iOS SDK
  description: >-
    Native iOS SDK that drives capture and streams media to Veriff. Initialised with a session URL.
  humanURL: https://github.com/Veriff/veriff-ios
  baseURL: https://github.com/Veriff/veriff-ios
  tags:
  - iOS SDK
  - Mobile
  - Capture
  properties:
  - type: Documentation
    url: https://github.com/Veriff/veriff-ios
- aid: veriff:android-sdk
  name: Veriff Android SDK
  description: >-
